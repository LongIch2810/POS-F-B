services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_local_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pos_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pos_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../POS_API
      dockerfile: Dockerfile
    container_name: pos_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-pos_local}:${POSTGRES_PASSWORD:-pos_local_secret}@postgres:5432/${POSTGRES_DB:-pos_local}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Quan tri he thong}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@Local2026!}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-pos_local_dev_jwt_secret_32_bytes_long_key!}
      CSRF_SECRET: ${CSRF_SECRET:-pos_local_dev_csrf_secret_32_bytes_long_key!}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ../POS_UI
      dockerfile: Dockerfile
    container_name: pos_ui
    environment:
      VITE_API_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pos_postgres_local:
